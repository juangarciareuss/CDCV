{% extends 'core/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/gym_arena.css' %}">
{% endblock %}

{% block content %}

<div class="gym-container">

    <div class="gold-header">
        <div class="d-flex align-items-center">
            <i class="fas fa-trophy me-2 text-white shadow-sm"></i>
            <h5 class="gold-title">{{ tema.nombre }}</h5>
        </div>
        
        <div class="gold-stats">
            <div class="stat-box" title="Dificultad Actual">
                <i class="fas fa-layer-group me-1"></i> <span id="difficulty-text">...</span>
            </div>
            <div class="stat-box">
                Nvl <span id="level-number" class="fs-6">{{ nivel_usuario|floatformat:1 }}</span>
            </div>
        </div>
    </div>

    <div class="arena-card">
        
        <div class="text-end mb-3">
            <small class="text-muted fw-bold"><i class="far fa-clock"></i> TIEMPO: <span id="timer">∞</span></small>
        </div>

        <div id="q-text" class="question-text">
            Cargando motor de entrenamiento...
        </div>

        <div id="options-area" class="options-grid">
            </div>

        <div id="feedback-modal" class="feedback-box d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold m-0" id="feedback-title">Análisis</h6>
                <span id="feedback-delta" class="fw-bold"></span>
            </div>
            <p id="feedback-content" class="text-secondary mb-3"></p>
            <button id="next-btn" class="btn btn-dark w-100 fw-bold py-2 rounded-3">
                Siguiente Desafío <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </div>

    </div>
</div>

<script>
    const TEMA_ID = "{{ tema.id }}";
    const CSRF_TOKEN = "{{ csrf_token }}";
</script>
<script src="{% static 'core/js/gym_engine.js' %}"></script>
{% endblock %}
